version: '3.8'

services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    ports:
      - "8888:8888"
    volumes:
      - ../data:/mnt/data:ro
      - ../output:/output
      - ../workspace:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - JUPYTER_TOKEN=eeg_adk_sandbox_token
    # Note: ensure that vLLM is running either locally or inside this docker network

  # Vector Database for RAG
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
