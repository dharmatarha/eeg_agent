services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    ports:
      - "8888:8888"
    volumes:
      - ${EEG_DATA_DIR:-../data}:/mnt/data:ro
      - ../output:/output
    environment:
      - JUPYTER_TOKEN=eeg_adk_sandbox_token
    # Note: ensure that vLLM is running either locally or inside this docker network
    deploy:
      resources:
        limits:
          memory: 24g


  # Vector Database for RAG
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
